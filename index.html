<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMESHZZ - WhatsApp Welcome</title>
    <style>
        body {
            margin: 0;
            background-color: #000000;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* මුළු තිරයම ආවරණය වන පරිදි මැට්‍රික්ස් කෑන්වස් එක */
        #matrix-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* මැද තියෙන ප්‍රධාන කාඩ් එක (පසුබිම මඳක් පාරදෘශ්‍යයි) */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(10, 15, 10, 0.85);
            border: 2px solid #00ff66;
            border-radius: 15px;
            padding: 30px 40px;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.5);
            max-width: 85%;
        }

        /* නම (IMESHZZ) */
        h1 {
            color: #00ff66;
            font-size: 26px;
            margin: 0 0 12px 0;
            text-shadow: 0 0 12px rgba(0, 255, 102, 0.8);
            letter-spacing: 2px;
        }

        /* යටින් වැටෙන මැසේජ් එක */
        p {
            color: #ffffff;
            font-size: 15px;
            margin: 0;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <!-- පසුබිම් කෝඩ් වැටෙන කෑන්වස් එක -->
    <canvas id="matrix-canvas"></canvas>

    <!-- මැද තියෙන පෙට්ටිය සහ විස්තර -->
    <div class="card">
        <h1>IMESHZZ 🚀</h1>
        <p>HI welcome to My Whatsapp chat</p>
    </div>

    <script>
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const characters = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const fontSize = 15;
        let columns = Math.floor(canvas.width / fontSize);
        const drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            // පසුබිම ටිකක් ෆේඩ් වෙමින් කෝඩ් පහළට ඇදී යාම සඳහා
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff66';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 45);

        window.addEventListener('resize', () => {
            columns = Math.floor(canvas.width / fontSize);
            drops.length = 0;
            for (let i = 0; i < columns; i++) {
                drops[i] = 1;
            }
        });
    </script>
</body>
</html>
