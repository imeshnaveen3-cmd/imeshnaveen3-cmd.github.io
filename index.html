<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMESHZZ - WhatsApp Welcome</title>
    <style>
        body {
            margin: 0;
            background-color: #0d1117;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        /* පසුබිම පුරාම කෝඩ් වැටෙන එක සජීවීකරණය කිරීම */
        .matrix-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: rgba(37, 211, 102, 0.2);
            font-size: 14px;
            line-height: 14px;
            pointer-events: none;
            white-space: pre;
            overflow: hidden;
            z-index: 1;
        }
        /* මැද පෙට්ටිය සම්පූර්ණයෙන්ම පාරදෘශ්‍ය (Transparent) කිරීම */
        .content-box {
            position: relative;
            z-index: 2;
            text-align: center;
            background: transparent;
            padding: 30px 40px;
            border-radius: 20px;
            border: 1px solid rgba(37, 211, 102, 0.5);
            box-shadow: 0 0 25px rgba(37, 211, 102, 0.2);
            backdrop-filter: blur(2px);
        }
        .welcome-text {
            color: #25d366;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(37, 211, 102, 0.8);
        }
        .name-badge {
            display: inline-block;
            background: #25d366;
            color: #0d1117;
            padding: 8px 20px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(37, 211, 102, 0.8);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- පසුබිම් කෝඩ් ටෙස්ට් වන කොටස -->
    <div class="matrix-bg" id="matrix"></div>

    <div class="content-box">
        <div class="welcome-text">Welcome to My Whatsapp chat!</div>
        <div class="name-badge">IMESHZZ 🚀</div>
    </div>

    <script>
        // පසුබිමේ කෝඩ් ස්ක්‍රෝල් වන විදිහ සකස් කිරීම
        const matrix = document.getElementById('matrix');
        const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%+-/~{}[];<>_IMESHZZ";
        const columns = Math.floor(window.innerWidth / 20);
        
        let drops = [];
        for(let i=0; i<columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            let text = "";
            for(let i=0; i<drops.length; i++) {
                let char = characters.charAt(Math.floor(Math.random() * characters.length));
                text += char + " ";
                if(drops[i]*14 > window.innerHeight && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
            matrix.innerText = text.repeat(30);
        }
        setInterval(drawMatrix, 50);
    </script>
</body>
</html>
